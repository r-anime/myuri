---
name: Tests
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
jobs:
  Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Python version
        id: python-version
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+(\.[0-9]+)?)-[^[:space:]]+[[:space:]]+AS build-image$/\1/p' Dockerfile | head -n 1)
          test -n "$version" || { echo "Could not find Python version for build-image" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-version.outputs.version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create config.ini
        run: |
          cp config.ini.example config.ini
          python -c "import secrets; print(secrets.token_urlsafe(50))" > /tmp/secret_key
          sed -i "s/^secret_key = *$/secret_key = $(cat /tmp/secret_key)/" config.ini
      - name: Run tests
        working-directory: src/myuri
        run: python manage.py test
